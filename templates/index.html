<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>7075.uz - Taksi</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="login-page">
    <div class="login-container">
        <div class="login-box">
            <div class="logo">
                <h1>🚖 7075.uz</h1>
                <p>Taksi va yo'lovchilarni bog'laydigan xizmat</p>
            </div>
            
            <div class="login-content">
                <h2>Telegram orqali kirish</h2>
                <p>Bot'ni oching va /start bosing.</p>
                
                <!-- Telegram bot link (to'g'ri yechim) -->
                <a href="https://t.me/Taxi7075uzbot?start=web_login" 
                   class="btn-primary telegram-btn">
                    🤖 Telegram Bot'ni Oching
                </a>
                
                <p class="info-text">
                    Bot'da ro'yxatdan o'tgandan keyin, web saytga avtomatik qaytarsiz.
                </p>
            </div>
        </div>
    </div>

    <script>
        // Bot'dan web sayt'ga redirect qilish uchun
        // (Bot'da /start handler qo'lda redirect link) 
        const params = new URLSearchParams(window.location.search);
        if (params.get('tg_id')) {
            // Simple session qo'ying
            document.cookie = `session_tg_id=${params.get('tg_id')}; path=/;`;
            window.location.href = '/dashboard';
        }
    </script>
</body>
</html>
